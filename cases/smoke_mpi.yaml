# smoke test case: small grid, few steps, fast JIT/checks
case: smoke_mpi

domain:
  lx: 1.0
  ly: 1.0
  lz: 1.0

grid:
  nx: 40
  ny: 40
  nz: 40

physics:
  reynolds: 400
  sgs:
    enabled: true
    model: wale
    cw: 0.46

initial:
  type: rest
  noise: 0.01

boundaries:
  west: wall
  east: wall
  south: slip
  north: slip
  bottom: wall
  top: moving_lid
  lid_velocity: 1.0

numerics:
  time_scheme: rk2
  convection: cds4
  diffusion: explicit4
  pressure_solver: multigrid
  mg_levels: 2
  max_outer_iters: 30
  div_tolerance: 1.0e-6
  ghost_layers: 3

time:
  n_steps: 10
  variable_dt: true
  dt_init: 3.0e-4
  safety_factor: 0.8
  dt_growth: 1.1

output:
  n_out: 10
  log_interval: 1
  outdir: output_smoke_mpi

mpi:
  domains: [2, 2, 2]
